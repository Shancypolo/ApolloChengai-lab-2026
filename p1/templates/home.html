{% extends "base.html" %}
{% block title %}PageOne{% endblock %}
{% block content %}
<section class="home-hero">
  <img class="hero-logo" src="{{ url_for('static', filename='images/pageone-wordmark.png') }}" alt="">
  <form class="search-form" method="post" action="{{ url_for('inspect_source') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input id="source-url" name="source_url" type="url" placeholder="Paste YouTube URL" required>
    <button class="button button-dark" type="submit">Summarize</button>
  </form>
</section>
{% endblock %}
