{% extends "base.html" %}
{% block title %}PageOne{% endblock %}
{% block content %}
<section class="home-hero">
  <h1 class="hero-logo">P. 1</h1>
  <form class="home-form" method="post" action="{{ url_for('inspect_source') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="search-form"><input id="source-url" name="source_url" type="url" placeholder="Paste YouTube URL" required>
    <button class="button button-dark" type="submit">Summarize →</button></div>
    <div class="home-options">
      <label for="target-list">Add single video to</label>
      <select id="target-list" name="target_list"><option value="">New archive entry</option>{% for item in summary_lists %}<option value="{{ item.id }}">{{ item.title }}</option>{% endfor %}</select>
      <label class="small-check"><input type="checkbox" name="replace_saved" value="yes"> Replace saved playlist summaries</label>
    </div>
  </form>
</section>
{% endblock %}
