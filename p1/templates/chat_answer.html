{% extends "base.html" %}
{% block title %}Video question — PageOne{% endblock %}
{% block content %}
{% include "error_notice.html" %}
<section class="page-heading"><p class="kicker">VIDEO FOLLOW-UP</p><h1>Your question</h1></section>
<section class="settings-panel">
  <div class="chat-turn chat-{{ tone|default('success') }}"><p><strong>You</strong> {{ question }}</p><p><strong>PageOne</strong> {{ answer }}</p></div>
  {% if video_id %}
  <form class="chat-form" data-target="answer" method="post" action="{{ url_for('chat_about_video', video_id=video_id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="answer_window" value="1">
    <input name="question" value="{{ question if tone == 'error' else '' }}" placeholder="Ask a follow-up question…" maxlength="1000" required>
    <button class="button" type="submit">{{ 'Try again' if tone == 'error' else 'Ask' }}</button>
  </form>
  {% endif %}
  <p><a class="text-link" href="{{ url_for('archive_index') }}">Open archive ></a></p>
</section>
{% endblock %}
