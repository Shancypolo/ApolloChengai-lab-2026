<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PageOne notice</title>
  <link rel="stylesheet" href="/static/css/pageone.css">
</head>
<body>
  <main class="startup-shell">
    <img src="/static/images/pageone-wordmark.png" alt="">
    <div class="failure-shade"></div>
    <dialog open class="failure-dialog">
      <div class="failure-rule"></div>
      <h1>Notice</h1>
      <p>PageOne cannot start. Reinstall it and try again.</p>
      <a class="button button-dark" href="/">Retry</a>
    </dialog>
  </main>
</body>
</html>
